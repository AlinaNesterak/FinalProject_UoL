<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Works Catalogue Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1a1a18; --ink-soft:#3a3a36; --paper:#faf8f4; --paper-2:#f3efe7;
    --line:#e0d9cc; --accent:#a67c3d; --accent-deep:#7a5527; --muted:#6e695f;
    --focus:#8a6530;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}

  /* Accessibility: visible focus everywhere */
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:2px}
  .skip-link{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);padding:0.7rem 1.2rem;z-index:100;font-weight:600}
  .skip-link:focus{left:0.5rem;top:0.5rem}

  header{background:var(--ink);color:var(--paper);padding:2.5rem 2rem 2.2rem;position:relative;overflow:hidden;border-bottom:3px solid var(--accent)}
  header::after{content:"\266A";position:absolute;right:2.5rem;top:50%;transform:translateY(-50%);font-family:var(--serif);font-size:7rem;color:var(--accent);opacity:0.13;line-height:1;animation:floatNote 6s ease-in-out infinite}
  @keyframes floatNote{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-58%)}}
  .header-inner{max-width:1160px;margin:0 auto;position:relative;z-index:1}
  header .eyebrow{font-size:0.72rem;letter-spacing:0.32em;text-transform:uppercase;color:#c99a55;font-weight:500;margin-bottom:0.6rem;opacity:0;animation:fadeUp 0.7s ease 0.1s forwards}
  header h1{font-family:var(--serif);font-size:3.2rem;font-weight:600;line-height:1.05;opacity:0;animation:fadeUp 0.7s ease 0.25s forwards}
  header .tagline{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--paper-2);opacity:0;margin-top:0.5rem;animation:fadeUp 0.7s ease 0.4s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* Accessibility: respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    header .eyebrow,header h1,header .tagline,.controls{opacity:1 !important}
  }

  .container{max-width:1160px;margin:0 auto;padding:2.2rem 2rem 1rem}
  .controls{display:flex;gap:0.85rem;flex-wrap:wrap;align-items:center;margin-bottom:2rem;padding-bottom:1.6rem;border-bottom:1px solid var(--line);opacity:0;animation:fadeUp 0.6s ease 0.55s forwards}
  .search-wrap{position:relative;flex:1;min-width:240px}
  .search-wrap::before{content:"\2315";position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1.3rem;color:var(--muted);pointer-events:none}
  input[type="search"]{width:100%;padding:0.85rem 1rem 0.85rem 2.6rem;border:1px solid var(--line);border-radius:2px;font-size:1rem;background:white;font-family:var(--sans);color:var(--ink);transition:border-color 0.25s,box-shadow 0.25s}
  input[type="search"]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(166,124,61,0.18)}
  select{padding:0.85rem 1rem;border:1px solid var(--line);border-radius:2px;font-size:0.95rem;background:white;font-family:var(--sans);color:var(--ink);cursor:pointer}
  button{padding:0.85rem 1.6rem;border:1px solid var(--ink);border-radius:2px;cursor:pointer;font-size:0.82rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);font-family:var(--sans);transition:all 0.25s ease}
  button:hover{background:var(--accent-deep);border-color:var(--accent-deep);transform:translateY(-1px)}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button.ghost:hover{color:var(--accent-deep);border-color:var(--accent-deep)}

  .layout{display:grid;grid-template-columns:1fr;gap:2rem}
  @media(min-width:860px){.layout{grid-template-columns:1fr 1.05fr}}
  .count{font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}

  .work-list{display:flex;flex-direction:column;list-style:none}
  .work-card{background:transparent;border:none;border-bottom:1px solid var(--line);padding:1.15rem 1rem 1.15rem 0.6rem;cursor:pointer;position:relative;transition:background 0.3s,padding-left 0.3s;animation:cardIn 0.5s ease backwards;width:100%;text-align:left;font-family:inherit}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .work-card::before{content:"";position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent);transition:width 0.28s}
  .work-card:hover,.work-card:focus-visible{background:var(--paper-2);padding-left:1.3rem}
  .work-card:hover::before,.work-card:focus-visible::before{width:3px}
  .work-card.active{background:var(--paper-2);padding-left:1.3rem}
  .work-card.active::before{width:3px}
  .work-card .title{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:1.42rem;line-height:1.2}
  .work-card .meta{font-size:0.82rem;color:var(--muted);margin-top:0.35rem;display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap}
  .badge{display:inline-block;font-size:0.66rem;font-weight:600;letter-spacing:0.08em;padding:0.2rem 0.55rem;border:1px solid var(--accent);color:var(--accent-deep);border-radius:2px;text-transform:uppercase}

  .detail{background:white;border:1px solid var(--line);border-radius:2px;padding:2rem 2.1rem;position:sticky;top:1.5rem;align-self:start;box-shadow:0 1px 3px rgba(26,26,24,0.04);animation:detailIn 0.45s ease}
  @keyframes detailIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .detail .kicker{font-size:0.7rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:0.5rem}
  .detail h2{font-family:var(--serif);color:var(--ink);font-size:2.1rem;font-weight:600;line-height:1.12;margin-bottom:0.3rem}
  .detail .subtitle{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:1.15rem;margin-bottom:1.5rem;padding-bottom:1.2rem;border-bottom:1px solid var(--line)}
  .field{margin-bottom:0.7rem;font-size:0.95rem;display:flex;gap:1rem}
  .field .label{font-weight:600;color:var(--ink-soft);flex:0 0 130px;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;padding-top:0.15rem}
  .field .value{flex:1;color:var(--ink)}
  .missing{color:var(--muted);font-style:italic}

  /* Incipit block: notation + play */
  .incipit-block{margin:1.2rem 0 0.4rem;padding:1rem;background:var(--paper);border-left:3px solid var(--accent);border-radius:2px}
  .incipit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
  .incipit-title{font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .play-btn{padding:0.45rem 0.95rem;font-size:0.72rem;display:inline-flex;align-items:center;gap:0.45rem}
  .play-btn .icon{font-size:0.85rem}
  .notation{width:100%;height:auto;display:block}
  .notation-caption{font-size:0.75rem;color:var(--muted);font-style:italic;margin-top:0.3rem}

  .section{margin-top:1.8rem;padding-top:1.4rem;border-top:1px solid var(--line)}
  .section h3{font-family:var(--serif);font-size:1.4rem;font-weight:600;color:var(--ink);margin-bottom:0.6rem}
  .src-item{padding:0.65rem 0.2rem;border-bottom:1px solid var(--line);font-size:0.92rem}
  .src-item:last-child{border-bottom:none}
  .src-title{font-weight:600}
  .src-meta{color:var(--muted);font-size:0.85rem;margin-top:0.15rem}
  .src-type{display:inline-block;font-size:0.64rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:0.14rem 0.5rem;border-radius:2px;margin-left:0.5rem;vertical-align:middle}
  .src-type.manuscript{background:#efe6d8;color:#6b4f22;border:1px solid #d9c49a}
  .src-type.print{background:#e8ece8;color:#33513f;border:1px solid #b9c9bd}
  .perf-item{display:flex;gap:1rem;padding:0.65rem 0.2rem;border-bottom:1px solid var(--line);font-size:0.92rem}
  .perf-item:last-child{border-bottom:none}
  .perf-date{font-weight:600;color:var(--accent-deep);flex:0 0 105px;font-variant-numeric:tabular-nums}
  .disclaimer{font-size:0.78rem;color:var(--muted);font-style:italic;margin-bottom:0.9rem}
  .similar-item{display:flex;justify-content:space-between;align-items:center;padding:0.8rem 0.2rem;border-bottom:1px solid var(--line);cursor:pointer;transition:padding-left 0.25s;background:none;border-left:none;border-right:none;border-top:none;width:100%;font-family:inherit;text-align:left}
  .similar-item:last-child{border-bottom:none}
  .similar-item:hover,.similar-item:focus-visible{padding-left:0.6rem}
  .similar-item:hover .sim-title,.similar-item:focus-visible .sim-title{color:var(--accent-deep)}
  .sim-title{font-family:var(--serif);font-size:1.15rem;transition:color 0.25s}
  .score{font-weight:600;font-size:0.9rem;color:var(--ink);display:flex;align-items:center;gap:0.5rem}
  .score-bar{width:46px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .score-bar span{display:block;height:100%;background:var(--accent-deep);border-radius:2px}
  .empty{color:var(--muted);text-align:center;padding:3rem 1rem;font-style:italic;font-family:var(--serif);font-size:1.2rem}
  .placeholder{display:flex;align-items:center;justify-content:center;min-height:300px}
  footer{text-align:center;padding:2.5rem 2rem 2rem;color:var(--muted);font-size:0.8rem;border-top:1px solid var(--line);margin-top:2rem}
  footer a{color:var(--accent-deep);text-decoration:underline;text-underline-offset:3px}
  footer .divider{margin:0 0.6rem;color:var(--line)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<a class="skip-link" href="#workList">Skip to work list</a>
<header role="banner">
  <div class="header-inner">
    <div class="eyebrow">A New Approach to Music Cataloguing</div>
    <h1>Music Works Catalogue</h1>
    <div class="tagline">Exploring the thematic catalogues of classical composers</div>
  </div>
</header>
<main class="container" role="main">
  <div class="controls" role="search">
    <div class="search-wrap">
      <label for="searchBox" class="sr-only">Search works by title, composer, or genre</label>
      <input type="search" id="searchBox" placeholder="Search by title, composer, or genre&hellip;">
    </div>
    <button onclick="doSearch()" aria-label="Search the catalogue">Search</button>
    <label for="catFilter" class="sr-only">Filter by catalogue</label>
    <select id="catFilter" onchange="loadWorks()">
      <option value="">All catalogues</option>
    </select>
    <button class="ghost" onclick="resetView()" aria-label="Reset search and filters">Reset</button>
  </div>
  <div class="layout">
    <section aria-label="Work list">
      <div class="count" id="count" role="status" aria-live="polite"></div>
      <div class="work-list" id="workList"></div>
    </section>
    <section id="detailPane" aria-label="Work details" aria-live="polite">
      <div class="detail placeholder"><div class="empty">Select a work to view its details</div></div>
    </section>
  </div>
</main>
<footer role="contentinfo">
  Music Works Catalogue Portal &middot; Prototype
  <span class="divider">&middot;</span>
  <a href="/docs" target="_blank" rel="noopener">API documentation</a>
  <span class="divider">&middot;</span>
  <a href="https://github.com/AlinaNesterak/FinalProject_UoL" target="_blank" rel="noopener">GitHub</a>
</footer>
<script>
const API="";
async function fetchJSON(u){const r=await fetch(API+u);if(!r.ok)throw new Error(r.status);return r.json();}
async function loadCatalogues(){
  try{const cats=await fetchJSON("/catalogues");const sel=document.getElementById("catFilter");
    cats.forEach(c=>{const o=document.createElement("option");o.value=c.catalogue;o.textContent=c.catalogue+" \u2014 "+c.works+" works";sel.appendChild(o);});}catch(e){}}
async function loadWorks(){
  const cat=document.getElementById("catFilter").value;
  const url=cat?"/works?catalogue="+encodeURIComponent(cat):"/works";
  try{renderList(await fetchJSON(url));}
  catch(e){document.getElementById("workList").innerHTML='<div class="empty">Could not load works. Is the server running?</div>';}}
async function doSearch(){
  const q=document.getElementById("searchBox").value.trim();
  if(!q){loadWorks();return;}
  try{renderList(await fetchJSON("/works/search?q="+encodeURIComponent(q)),"Results for \u201C"+q+"\u201D");}
  catch(e){document.getElementById("workList").innerHTML='<div class="empty">Search failed.</div>';}}
function resetView(){
  document.getElementById("searchBox").value="";document.getElementById("catFilter").value="";loadWorks();
  document.getElementById("detailPane").innerHTML='<div class="detail placeholder"><div class="empty">Select a work to view its details</div></div>';}
function renderList(works,heading){
  const list=document.getElementById("workList");
  document.getElementById("count").textContent=heading?heading+" \u2014 "+works.length+" work(s)":works.length+" work(s) in view";
  if(!works.length){list.innerHTML='<div class="empty">No works found</div>';return;}
  list.innerHTML="";
  works.forEach((w,i)=>{
    const card=document.createElement("button");
    card.className="work-card";card.style.animationDelay=(i*0.04)+"s";
    card.setAttribute("aria-label","View details for "+(w.title_main||w.work_id)+" by "+(w.composer||"unknown composer"));
    card.onclick=()=>{showDetail(w.work_id);highlight(card);};
    card.innerHTML='<div class="title">'+esc(w.title_main||"(untitled)")+'</div>'+
      '<div class="meta"><span class="badge">'+esc(w.work_id)+'</span><span>'+esc(w.composer||"")+'</span><span aria-hidden="true">\u00B7</span><span>'+esc(w.genre||"\u2014")+'</span></div>';
    list.appendChild(card);});}
function highlight(card){document.querySelectorAll(".work-card").forEach(c=>c.classList.remove("active"));card.classList.add("active");}
async function showDetail(id){
  const pane=document.getElementById("detailPane");
  pane.innerHTML='<div class="detail placeholder"><div class="empty">Loading\u2026</div></div>';
  try{const w=await fetchJSON("/works/"+encodeURIComponent(id));
    let sim=[];try{sim=await fetchJSON("/works/"+encodeURIComponent(id)+"/similar");}catch{}
    pane.innerHTML=renderDetail(w,sim);
    drawNotation(w);
    const pb=document.getElementById("playBtn");
    if(pb) pb.onclick=()=>playIncipit(w.incipit_pitches,w.incipit_durations,pb);
  }catch(e){pane.innerHTML='<div class="detail placeholder"><div class="empty">Could not load details</div></div>';}}
function fld(l,v){
  const val=(v&&(!Array.isArray(v)||v.length))?(Array.isArray(v)?v.join(", "):v):null;
  return '<div class="field"><span class="label">'+l+'</span>'+(val?'<span class="value">'+esc(val)+'</span>':'<span class="value missing">not recorded</span>')+'</div>';}

function renderDetail(w,sim){
  // Incipit block with notation + play button (only if pitches exist)
  let incipitHtml="";
  if(w.incipit_pitches&&w.incipit_pitches.length){
    incipitHtml='<div class="incipit-block">'+
      '<div class="incipit-head"><span class="incipit-title">Incipit \u2014 opening theme</span>'+
      '<button id="playBtn" class="play-btn" aria-label="Play the opening notes of this work"><span class="icon" aria-hidden="true">\u25B6</span> Play</button></div>'+
      '<svg id="notation" class="notation" role="img" aria-label="Musical notation of the opening theme: '+esc(w.incipit_pitches.join(", "))+'"></svg>'+
      '<div class="notation-caption">'+esc(w.incipit_tempo||"")+(w.incipit_key?' \u00B7 '+esc(w.incipit_key):'')+(w.incipit_meter?' \u00B7 '+esc(w.incipit_meter):'')+'</div></div>';
  }
  // Manuscripts & sources
  let srcHtml="";
  if(w.sources&&w.sources.length){
    srcHtml='<div class="section"><h3>Manuscripts &amp; Sources</h3>'+
      w.sources.map(s=>'<div class="src-item"><span class="src-title">'+esc(s.title||"Untitled source")+'</span>'+
        (s.type?'<span class="src-type '+esc(s.type)+'">'+esc(s.type)+'</span>':'')+
        '<div class="src-meta">'+esc(s.repository||"")+(s.shelfmark?' \u00B7 Shelfmark: '+esc(s.shelfmark):'')+'</div></div>').join("")+'</div>';}
  // Performance history
  let perfHtml="";
  if(w.performances&&w.performances.length){
    perfHtml='<div class="section"><h3>Performance History</h3>'+
      w.performances.map(p=>'<div class="perf-item"><span class="perf-date">'+esc(p.date||"")+'</span><span>'+esc(p.description||"")+'</span></div>').join("")+'</div>';}
  // Similar works
  let simHtml="";
  if(sim&&sim.length){
    simHtml='<div class="section"><h3>Melodically Similar Works</h3>'+
      '<div class="disclaimer">Computational suggestions based on incipit similarity &mdash; not scholarly claims.</div>'+
      sim.map(s=>'<button class="similar-item" onclick="showDetail(\''+esc(s.work_id)+'\')" aria-label="View '+esc(s.title||s.work_id)+', similarity score '+s.score.toFixed(2)+'">'+
        '<span class="sim-title">'+esc(s.title||s.work_id)+' <span class="badge">'+esc(s.work_id)+'</span></span>'+
        '<span class="score"><span class="score-bar" aria-hidden="true"><span style="width:'+Math.round(s.score*100)+'%"></span></span>'+s.score.toFixed(2)+'</span></button>').join("")+'</div>';}
  return '<div class="detail">'+
    '<div class="kicker">'+esc(w.catalogue)+' \u00B7 '+esc(w.work_id)+'</div>'+
    '<h2>'+esc(w.title_main||"(untitled)")+'</h2>'+
    '<div class="subtitle">'+esc(w.composer||"")+'</div>'+
    fld("Opus",w.opus)+fld("Genre",w.genre)+fld("Date",w.date_text)+
    fld("Danish title",w.title_da)+fld("English title",w.title_en)+
    fld("Instrumentation",w.instrumentation)+
    incipitHtml+srcHtml+perfHtml+simHtml+'</div>';}

/* ---------- WOW 1: SVG notation rendering ---------- */
const STEP={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
function diatonicIndex(p){ // "F#5" -> diatonic step index for vertical placement
  const m=p.match(/^([A-G])([#b]*)(\d)$/); if(!m)return null;
  return STEP[m[1]]+7*parseInt(m[3]);}
function drawNotation(w){
  const svg=document.getElementById("notation"); if(!svg)return;
  const pitches=w.incipit_pitches||[], durs=w.incipit_durations||[];
  if(!pitches.length)return;
  const n=pitches.length, noteGap=64, left=70, right=30;
  const width=left+n*noteGap+right, height=130, staffTop=35, lineGap=11;
  svg.setAttribute("viewBox","0 0 "+width+" "+height);
  let elems="";
  // 5 staff lines
  for(let i=0;i<5;i++){const y=staffTop+i*lineGap;
    elems+='<line x1="10" y1="'+y+'" x2="'+(width-10)+'" y2="'+y+'" stroke="#3a3a36" stroke-width="1"/>';}
  // Treble clef (text glyph)
  elems+='<text x="18" y="'+(staffTop+3.55*lineGap)+'" font-size="'+(lineGap*4.6)+'" font-family="serif" fill="#1a1a18">\uD834\uDD1E</text>';
  // E5 (top space ref): staff top line is F5 in treble; use diatonic mapping
  const topLineIdx=diatonicIndex("F5"); // y = staffTop for F5
  pitches.forEach((p,i)=>{
    const di=diatonicIndex(p); if(di==null)return;
    const y=staffTop+(topLineIdx-di)*(lineGap/2);
    const x=left+i*noteGap;
    const dur=durs[i]||4;
    const filled=dur>=4; // quarter and shorter: filled head
    // ledger lines if needed
    for(let ly=staffTop-lineGap; ly>=y-2; ly-=lineGap) elems+='<line x1="'+(x-10)+'" y1="'+ly+'" x2="'+(x+10)+'" y2="'+ly+'" stroke="#3a3a36" stroke-width="1"/>';
    for(let ly=staffTop+5*lineGap; ly<=y+2; ly+=lineGap) elems+='<line x1="'+(x-10)+'" y1="'+ly+'" x2="'+(x+10)+'" y2="'+ly+'" stroke="#3a3a36" stroke-width="1"/>';
    // accidental
    if(p.includes("#")) elems+='<text x="'+(x-16)+'" y="'+(y+4)+'" font-size="14" font-family="serif" fill="#1a1a18">\u266F</text>';
    if(p.includes("b")&&p.length>2) elems+='<text x="'+(x-15)+'" y="'+(y+4)+'" font-size="14" font-family="serif" fill="#1a1a18">\u266D</text>';
    // note head
    elems+='<ellipse cx="'+x+'" cy="'+y+'" rx="6.4" ry="4.8" fill="'+(filled?'#1a1a18':'none')+'" stroke="#1a1a18" stroke-width="1.6" transform="rotate(-14 '+x+' '+y+')"/>';
    // stem (up if below middle line, down if above)
    const mid=staffTop+2*lineGap;
    if(y>=mid) elems+='<line x1="'+(x+6)+'" y1="'+y+'" x2="'+(x+6)+'" y2="'+(y-30)+'" stroke="#1a1a18" stroke-width="1.5"/>';
    else elems+='<line x1="'+(x-6)+'" y1="'+y+'" x2="'+(x-6)+'" y2="'+(y+30)+'" stroke="#1a1a18" stroke-width="1.5"/>';
    // flag for eighth notes
    if(dur>=8){const sx=y>=mid?x+6:x-6, sy=y>=mid?y-30:y+30, dir=y>=mid?1:-1;
      elems+='<path d="M '+sx+' '+sy+' q 9 '+(6*dir)+' 5 '+(16*dir)+'" stroke="#1a1a18" stroke-width="2" fill="none"/>';}
  });
  svg.innerHTML=elems;}

/* ---------- WOW 2: Web Audio incipit playback ---------- */
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function toFreq(p){
  const m=p.match(/^([A-G])([#b]*)(\d)$/); if(!m)return null;
  let s=SEMI[m[1]];
  for(const c of m[2]) s+= c==="#"?1:-1;
  const midi=s+(parseInt(m[3])+1)*12;
  return 440*Math.pow(2,(midi-69)/12);}
let audioCtx=null, playing=false;
function playIncipit(pitches,durs,btn){
  if(playing)return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  playing=true; btn.disabled=true; btn.innerHTML='<span class="icon" aria-hidden="true">\u266B</span> Playing\u2026';
  const bpm=100, beat=60/bpm; let t=audioCtx.currentTime+0.08;
  pitches.forEach((p,i)=>{
    const f=toFreq(p); if(!f)return;
    const durBeats=4/(durs[i]||4); // dur 4 = 1 beat, dur 8 = 0.5
    const len=durBeats*beat*0.92;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=f;
    // soft envelope
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+len);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+len+0.05);
    t+=durBeats*beat;});
  setTimeout(()=>{playing=false;btn.disabled=false;
    btn.innerHTML='<span class="icon" aria-hidden="true">\u25B6</span> Play';},(t-audioCtx.currentTime)*1000+150);}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
