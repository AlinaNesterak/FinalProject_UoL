# nginx site configuration for the Music Works Catalogue Portal
# Install to: /etc/nginx/sites-available/musicworks
# then:      ln -s /etc/nginx/sites-available/musicworks /etc/nginx/sites-enabled/
#
# nginx terminates public HTTP traffic and proxies to the uvicorn process
# listening on localhost:8000. This keeps the application off the public
# interface and gives a clean URL without a port number.

server {
    listen 80;
    listen [::]:80;

    # Azure-assigned DNS name for this VM.
    server_name elearning-alinanesterak.switzerlandnorth.cloudapp.azure.com;

    # Modest limits: this is a read-only catalogue, not an upload service.
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Preserve the original host and client IP so the application and
        # its logs see real request details rather than nginx's own.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # The catalogue data changes only when the pipeline is re-run, so the
    # static interface can be cached briefly to reduce load.
    location = /favicon.ico { access_log off; log_not_found off; }
}
