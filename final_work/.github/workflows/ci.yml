name: CI

# Runs the full test suite on every push and pull request, addressing the
# absence of automated testing and continuous integration that the
# literature review identified as a weakness of the original MerMEId system
# (Bue et al., 2023).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy transform api --ignore-missing-imports
        continue-on-error: true   # advisory for now; see README quality notes

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run backend tests (pytest)
        run: pytest tests/test_prototype.py -v

      - name: Run end-to-end tests (Playwright)
        run: pytest tests/test_frontend.py -v

      - name: Run evaluation script
        run: python evaluation/evaluate.py
